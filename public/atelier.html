<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMT DU SAHEL — Workshop Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#0e141f; --bg2:#131b28; --card:#182231; --card2:#1f2b3d;
  --line:#2a3away; --line:#28344a; --text:#e8edf5; --muted:#9fb0c9; --muted2:#6d7f99;
  --brass:#f59e5c; --brass-dim:#a8683a; --green:#34d399; --red:#f2645a;
  --blue:#4c8bf5; --primary:#2563eb; --primary-hi:#3b82f6; --teal:#2dd4bf;
  --radius:12px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow-1:0 2px 6px rgba(0,0,0,.28);
  --shadow-2:0 8px 24px rgba(0,0,0,.38);
  --serif:'Segoe UI Semibold',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;
  --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(1200px 600px at 10% -10%, rgba(37,99,235,.12), transparent 60%),
  var(--bg);
  color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{width:248px;flex-shrink:0;background:linear-gradient(180deg,var(--bg2),#101724);border-right:1px solid var(--line);padding:24px 0;display:flex;flex-direction:column}
.brand{font-family:var(--sans);font-size:19px;font-weight:800;letter-spacing:.6px;padding:0 20px 6px;color:var(--text);text-transform:uppercase}
.brand small{display:block;font-size:10px;color:var(--muted2);letter-spacing:1.8px;text-transform:uppercase;margin-top:6px;font-weight:600}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:4px;padding:0 12px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;text-align:left;border-radius:10px;font-family:var(--sans);transition:all .18s var(--ease)}
.nav-btn .idx{font-family:var(--mono);color:var(--muted2);font-size:11px;width:18px;transition:color .18s var(--ease)}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,.05);transform:translateX(2px)}
.nav-btn.active{color:#fff;background:linear-gradient(90deg,var(--primary),#1d4ed8);box-shadow:var(--shadow-1)}
.nav-btn.active .idx{color:rgba(255,255,255,.75)}

/* ---------- Layout ---------- */
.main{flex:1;padding:36px 44px;max-width:1220px;animation:fadeUp .28s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-family:var(--sans);font-size:30px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px;color:var(--text)}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:26px;line-height:1.5}

.card{background:linear-gradient(180deg,var(--card),#151f2d);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:22px;box-shadow:var(--shadow-1);transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease)}
.card:hover{box-shadow:var(--shadow-2);border-color:#33425e}
.card h2{font-size:15px;margin:0 0 18px;color:var(--text);font-weight:700;letter-spacing:.2px;border-bottom:1px solid var(--line);padding-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2::before{content:'';width:4px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--primary-hi),var(--teal))}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;min-width:150px}
.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}

/* ---------- Inputs ---------- */
input,select{background:#0f1725;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;font-size:14px;font-family:var(--sans);transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
input:hover,select:hover{border-color:#3a4a68}
input:focus,select:focus{outline:none;border-color:var(--primary-hi);box-shadow:0 0 0 3px rgba(59,130,246,.22);background:#111b2b}
input[type=number]{font-family:var(--mono)}
::placeholder{color:var(--muted2)}

/* ---------- Buttons ---------- */
button{cursor:pointer;font-family:var(--sans)}
.btn{background:linear-gradient(180deg,var(--primary-hi),var(--primary));color:#fff;border:1px solid rgba(255,255,255,.08);padding:12px 24px;border-radius:10px;font-size:13.5px;font-weight:600;letter-spacing:.2px;box-shadow:var(--shadow-1);transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease),opacity .16s var(--ease)}
.btn:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 8px 20px rgba(37,99,235,.35)}
.btn:active{transform:translateY(0) scale(.99);box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.secondary{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text)}
.btn.secondary:hover{background:rgba(255,255,255,.09);box-shadow:var(--shadow-1)}
.btn.danger{background:rgba(242,100,90,.1);border:1px solid rgba(242,100,90,.45);color:var(--red)}
.btn.danger:hover{background:rgba(242,100,90,.2);box-shadow:0 8px 18px rgba(242,100,90,.2)}
.btn.small{padding:8px 14px;font-size:12px;border-radius:8px}
.nav-btn:focus-visible{outline:2px solid var(--primary-hi);outline-offset:2px}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,.05);font-family:var(--mono);font-size:13px}
tbody tr{transition:background .14s var(--ease)}
tr:hover td{background:var(--card2)}
.num{text-align:right}
.neg{color:var(--red);font-weight:700}
.pos{color:var(--green)}
.muted{color:var(--muted2)}
.empty{padding:34px 24px;text-align:center;color:var(--muted2);font-size:13.5px;line-height:1.6;border:1px dashed var(--line);border-radius:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;font-family:var(--sans);text-transform:capitalize}
.pill.rank1{background:rgba(52,211,153,.15);color:var(--green)}
.pill.rank-lo{background:rgba(242,100,90,.15);color:var(--red)}

/* ---------- Workers ---------- */
.worker-block{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.worker-block:hover{border-color:#39496a;box-shadow:var(--shadow-1)}
.worker-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer;background:var(--card2);transition:background .16s var(--ease)}
.worker-head:hover{background:#26344a}
.worker-name{font-size:15px;font-weight:700}
.worker-role{color:var(--muted);font-size:12px;font-family:var(--sans)}
.worker-body{padding:18px;display:none;background:var(--bg2)}
.worker-body.open{display:block;animation:fadeUp .22s var(--ease)}
.net{font-family:var(--mono);font-size:19px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.actions{display:flex;gap:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,18,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .18s var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(180deg,var(--card),#141d2b);border:1px solid var(--line);border-radius:16px;padding:26px;width:340px;box-shadow:var(--shadow-2);animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:700;color:var(--text)}
.modal input{width:100%;margin-bottom:16px;text-align:center;font-size:19px;letter-spacing:6px}
.modal .row{justify-content:flex-end}
.lock-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:16px}
.lock-screen .lock-icon{font-size:44px}

/* ---------- Stats ---------- */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,var(--card),#151f2d);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow-1);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;font-weight:600}
.stat .value{font-family:var(--mono);font-size:23px;font-weight:700}
footer.hint{font-size:11.5px;color:var(--muted2);margin-top:8px}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:300;max-width:calc(100% - 36px)}
.toast{background:linear-gradient(180deg,var(--card2),#182231);border:1px solid var(--line);border-left:4px solid var(--primary-hi);color:var(--text);padding:13px 16px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-2);animation:toastIn .24s var(--ease)}
.toast.error{border-left-color:var(--red)}
.toast.success{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--brass)}
.toast.hide{animation:toastOut .22s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(20px)}}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

@media (max-width: 780px){
  html,body{font-size:15px}
  .app{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
  .brand{display:none}
  .nav{flex-direction:row;margin-top:0;gap:6px;flex-wrap:nowrap;padding:0}
  .nav-btn{padding:11px 14px;white-space:nowrap;font-size:13.5px;min-height:44px}
  .nav-btn:hover{transform:none}
  .nav-btn .idx{display:none}
  .main{padding:18px 14px;max-width:100%}
  h1{font-size:23px}
  .subtitle{margin-bottom:16px;font-size:13px}
  .card{padding:16px;margin-bottom:16px;border-radius:12px}
  .card h2{font-size:14px;margin-bottom:14px}
  .row{gap:10px}
  .field{min-width:0;flex:1 1 140px}
  input,select{font-size:16px;padding:12px;min-height:44px}
  .btn{padding:12px 18px;font-size:14px;min-height:44px}
  .btn.small{padding:9px 12px;font-size:12.5px;min-height:38px}
  .actions{flex-wrap:wrap}
  table{font-size:12.5px;min-width:540px}
  th,td{padding:9px 8px}
  .grid2{grid-template-columns:1fr}
  .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:14px}
  .stat .value{font-size:18px}
  .stat .label{font-size:10px}
  .toolbar{gap:8px}
  .worker-head{padding:14px}
  .net{font-size:16px}
  .modal{width:calc(100% - 32px);max-width:340px}
  #toasts{left:14px;right:14px;bottom:14px}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">Atelier Ledger<small>Stock &middot; Payroll &middot; Sales</small></div>
    <div class="nav" id="nav">
      <button class="nav-btn" data-tab="workers"><span class="idx">01</span> Workers &amp; Pay</button>
      <button class="nav-btn" data-tab="stock"><span class="idx">02</span> Stock &amp; Purchases</button>
      <button class="nav-btn" data-tab="sales"><span class="idx">03</span> Sales</button>
      <button class="nav-btn" data-tab="commandes"><span class="idx">04</span> Commandes</button>
      <button class="nav-btn" data-tab="admin"><span class="idx">05</span> Admin Report</button>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/* ---------------- STORAGE ---------------- */
let DB = null;
const STORAGE_KEY = 'atelier-db-v1';
const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage !== null;

function emptyDB(){
  return {
    seq:1, workers:[], advances:[], absences:[],
    items:[], purchases:[], withdrawals:[],
    saleItems:[], sales:[], commandes:[]
  };
}
async function loadDB(){
  try{
    if(hasCloudStorage){
      const r = await window.storage.get(STORAGE_KEY, false);
      DB = r ? JSON.parse(r.value) : emptyDB();
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      DB = raw ? JSON.parse(raw) : emptyDB();
    }
  }catch(e){ DB = emptyDB(); }
  if(!DB.commandes) DB.commandes = [];
}
let saveTimer=null;
function saveDB(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{
      if(hasCloudStorage) await window.storage.set(STORAGE_KEY, JSON.stringify(DB), false);
      else localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    }
    catch(e){ console.error('save failed', e); }
  }, 150);
}
function uid(){ return DB.seq++; }

/* ---------------- HELPERS ---------------- */
function money(n){ n = Number(n)||0; return (n<0?'-':'') + 'DT ' + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(dateStr){ return (dateStr||todayStr()).slice(0,7); }
function monthLabel(mk){ const [y,m]=mk.split('-'); return new Date(y,m-1,1).toLocaleString(undefined,{month:'long',year:'numeric'}); }
function hoursPerDayForMonth(mk){ const m = Number(mk.split('-')[1]); return (m===7||m===8) ? 6 : 8; } // Jul/Aug: 7h-13h, else 8h-16h
const WORK_DAYS_PER_MONTH = 26;
function thisMonthKey(){ return todayStr().slice(0,7); }

function workerPayForMonth(workerId, mk){
  const w = DB.workers.find(x=>x.id===workerId);
  if(!w) return null;
  const hpd = hoursPerDayForMonth(mk);
  const dailyRate = w.monthlySalary / WORK_DAYS_PER_MONTH;
  const hourlyRate = dailyRate / hpd;
  const advances = DB.advances.filter(a=>a.workerId===workerId && monthKey(a.date)===mk);
  const absences = DB.absences.filter(a=>a.workerId===workerId && monthKey(a.date)===mk);
  const advTotal = advances.reduce((s,a)=>s+Number(a.amount),0);
  let deduction = 0;
  absences.forEach(a=>{
    if(a.type==='day') deduction += dailyRate;
    else deduction += hourlyRate * Number(a.hours||0);
  });
  const net = w.monthlySalary - advTotal - deduction;
  const maxPossible = hpd * WORK_DAYS_PER_MONTH;
  let missedHours = 0;
  absences.forEach(a=>{ missedHours += a.type==='day' ? hpd : Number(a.hours||0); });
  const performance = maxPossible>0 ? Math.max(0, ((maxPossible-missedHours)/maxPossible)*100) : 100;
  return {worker:w, dailyRate, hourlyRate, advTotal, deduction, net, performance, advances, absences};
}

function itemAvgCost(itemId){
  const p = DB.purchases.filter(x=>x.itemId===itemId);
  const qty = p.reduce((s,x)=>s+Number(x.quantity),0);
  const cost = p.reduce((s,x)=>s+Number(x.quantity)*Number(x.unitCost),0);
  return qty>0 ? cost/qty : 0;
}
function itemStock(itemId){
  const inQty = DB.purchases.filter(x=>x.itemId===itemId).reduce((s,x)=>s+Number(x.quantity),0);
  const outQty = DB.withdrawals.filter(x=>x.itemId===itemId).reduce((s,x)=>s+Number(x.quantity),0);
  return inQty - outQty;
}

/* ---------------- PIN MODALS ---------------- */
function askPin(title, expected){
  return new Promise(resolve=>{
    const bg=document.createElement('div');
    bg.className='modal-bg';
    bg.innerHTML=`<div class="modal">
      <h3>${title}</h3>
      <input type="password" maxlength="8" id="pinInput" placeholder="code" autofocus>
      <div class="row">
        <button class="btn secondary small" id="pinCancel">Cancel</button>
        <button class="btn small" id="pinOk">Confirm</button>
      </div>
      <div id="pinErr" style="color:var(--red);font-size:12px;margin-top:8px;display:none">Wrong code</div>
    </div>`;
    document.body.appendChild(bg);
    const input=bg.querySelector('#pinInput');
    input.focus();
    const cleanup=(val)=>{ document.body.removeChild(bg); resolve(val); };
    bg.querySelector('#pinCancel').onclick=()=>cleanup(false);
    bg.querySelector('#pinOk').onclick=()=>{
      if(input.value===expected) cleanup(true);
      else { bg.querySelector('#pinErr').style.display='block'; input.value=''; input.focus(); }
    };
    input.onkeydown=e=>{ if(e.key==='Enter') bg.querySelector('#pinOk').click(); };
  });
}

/* ---------------- NAV ---------------- */
let activeTab='workers';
let adminUnlocked=false;
document.getElementById('nav').addEventListener('click', e=>{
  const btn=e.target.closest('.nav-btn'); if(!btn) return;
  activeTab=btn.dataset.tab;
  render();
});

function render(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
  const main=document.getElementById('main');
  if(activeTab==='workers') main.innerHTML=renderWorkers();
  else if(activeTab==='stock') main.innerHTML=renderStock();
  else if(activeTab==='sales') main.innerHTML=renderSales();
  else if(activeTab==='commandes') main.innerHTML=renderCommandes();
  else if(activeTab==='admin') main.innerHTML=renderAdmin();
  bindEvents();
}

/* ================= WORKERS TAB ================= */
let workersMonth = thisMonthKey();
let openWorkerId = null;

function renderWorkers(){
  const hpd = hoursPerDayForMonth(workersMonth);
  const rows = DB.workers.map(w=>workerPayForMonth(w.id, workersMonth));
  const ranked = [...rows].sort((a,b)=>b.performance-a.performance);

  return `
  <h1>Workers &amp; Pay</h1>
  <div class="subtitle">26 working days/month &middot; 8h&ndash;16h (8h/day) except July&ndash;August 7h&ndash;13h (6h/day). Currently viewing <b style="color:var(--brass)">${monthLabel(workersMonth)}</b> &mdash; ${hpd}h/day.</div>

  <div class="card">
    <h2>Add a worker</h2>
    <form id="addWorkerForm" class="row">
      <div class="field"><label>Name</label><input name="name" required></div>
      <div class="field"><label>Role</label><input name="role" placeholder="e.g. Assembler"></div>
      <div class="field"><label>Monthly salary (DT)</label><input name="salary" type="number" step="any" min="0" required></div>
      <button class="btn" type="submit">Add worker</button>
    </form>
  </div>

  <div class="toolbar">
    <div class="field"><label>Payroll month</label><input type="month" id="monthPicker" value="${workersMonth}"></div>
    <div class="actions">
      <button class="btn secondary" id="btnPayrollPdf">Generate payroll PDF</button>
    </div>
  </div>

  <div class="card">
    <h2>Workers this month (${rows.length})</h2>
    ${rows.length===0?'<div class="empty">No workers yet. Add one above.</div>':''}
    ${rows.map(r=>renderWorkerBlock(r, ranked)).join('')}
  </div>
  `;
}

function renderWorkerBlock(r, ranked){
  const w=r.worker;
  const isOpen = openWorkerId===w.id;
  const rankPos = ranked.findIndex(x=>x.worker.id===w.id);
  let pill='';
  if(ranked.length>1 && rankPos===0) pill=`<span class="pill rank1">Top performer</span>`;
  else if(ranked.length>1 && rankPos===ranked.length-1) pill=`<span class="pill rank-lo">Needs attention</span>`;
  return `
  <div class="worker-block">
    <div class="worker-head" data-open="${w.id}">
      <div>
        <span class="worker-name">${esc(w.name)}</span>
        <span class="worker-role"> &middot; ${esc(w.role||'—')}</span>
        ${pill}
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div class="net ${r.net<0?'neg':'pos'}">${money(r.net)}</div>
        <span class="muted" style="font-size:11px">${isOpen?'▲':'▼'}</span>
      </div>
    </div>
    <div class="worker-body ${isOpen?'open':''}">
      <div class="grid2">
        <div>
          <div class="table-wrap">
          <table>
            <tr><td class="muted">Monthly salary</td><td class="num">${money(w.monthlySalary)}</td></tr>
            <tr><td class="muted">Daily rate</td><td class="num">${money(r.dailyRate)}</td></tr>
            <tr><td class="muted">Hourly rate</td><td class="num">${money(r.hourlyRate)}</td></tr>
            <tr><td class="muted">Advances taken</td><td class="num neg">-${money(r.advTotal)}</td></tr>
            <tr><td class="muted">Absence deductions</td><td class="num neg">-${money(r.deduction)}</td></tr>
            <tr><td><b>Net pay</b></td><td class="num ${r.net<0?'neg':'pos'}"><b>${money(r.net)}</b></td></tr>

    </div>`;
  }
  const today = new Date();
  if(!adminFrom) adminFrom = today.toISOString().slice(0,8)+'01';
  if(!adminTo) adminTo = todayStr();

  const monthsInRange = countMonths(adminFrom, adminTo);
  const inRange = d => d>=adminFrom && d<=adminTo;

  // ---- Labor ----
  let laborCost = 0, totalAdvances = 0, totalAbsenceDed = 0;
  const workerBreakdown = DB.workers.map(w=>{
    const adv = DB.advances.filter(a=>a.workerId===w.id && inRange(a.date)).reduce((s,a)=>s+Number(a.amount),0);
    let ded = 0;
    DB.absences.filter(a=>a.workerId===w.id && inRange(a.date)).forEach(a=>{
      const mk = monthKey(a.date); const hpd = hoursPerDayForMonth(mk);
      const dailyRate = w.monthlySalary/WORK_DAYS_PER_MONTH, hourlyRate=dailyRate/hpd;
      ded += a.type==='day' ? dailyRate : hourlyRate*Number(a.hours||0);
    });
    const gross = w.monthlySalary*monthsInRange;
    const net = gross - adv - ded;
    laborCost += net; totalAdvances += adv; totalAbsenceDed += ded;
    return {w, gross, adv, ded, net};
  });

  // ---- Stock ----
  const purchasesInRange = DB.purchases.filter(p=>inRange(p.date));
  const stockCost = purchasesInRange.reduce((s,p)=>s+Number(p.quantity)*Number(p.unitCost),0);
  const withdrawalsInRange = DB.withdrawals.filter(x=>inRange(x.date));
  const cogs = withdrawalsInRange.reduce((s,x)=>s+Number(x.quantity)*itemAvgCost(x.itemId),0);
  const lowStock = DB.items.map(it=>({it, stk:itemStock(it.id)})).filter(x=>x.stk<=3);

  // ---- Sales ----
  const salesInRange = DB.sales.filter(s=>inRange(s.date));
  const revenue = salesInRange.reduce((s,x)=>s+Number(x.quantity)*Number(x.price),0);
  const salesCount = salesInRange.length;
  const avgOrder = salesCount? revenue/salesCount : 0;
  const grossProfit = revenue - cogs;
  const profit = revenue - laborCost - cogs;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  const grossMargin = revenue>0 ? (grossProfit/revenue)*100 : 0;

  // Top items by revenue
  const itemRev = {};
  salesInRange.forEach(s=>{
    const si=DB.saleItems.find(x=>x.id===s.saleItemId); const key = si?si.name:'—';
    itemRev[key] = (itemRev[key]||0) + Number(s.quantity)*Number(s.price);
  });
  const topItems = Object.entries(itemRev).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Commandes status breakdown (in range by date)
  const cmdInRange = DB.commandes.filter(c=>inRange(c.date));
  const cmdCounts = {waiting:0, ready:0, sold:0, cancel:0};
  const cmdValue = {waiting:0, ready:0, sold:0, cancel:0};
  cmdInRange.forEach(c=>{ cmdCounts[c.status] = (cmdCounts[c.status]||0)+1; cmdValue[c.status]=(cmdValue[c.status]||0)+Number(c.price||0); });

  // Top clients (from commandes)
  const clientSpend = {};
  cmdInRange.filter(c=>c.status==='sold').forEach(c=>{
    const k = (c.client||'—').trim() || '—';
    clientSpend[k] = (clientSpend[k]||0) + Number(c.price||0);
  });
  const topClients = Object.entries(clientSpend).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Monthly breakdown
  const months = [];
  { const a=new Date(adminFrom), b=new Date(adminTo);
    let y=a.getFullYear(), m=a.getMonth();
    while(y<b.getFullYear() || (y===b.getFullYear()&&m<=b.getMonth())){
      months.push(`${y}-${String(m+1).padStart(2,'0')}`);
      m++; if(m>11){m=0;y++;}
    }
  }
  const monthly = months.map(mk=>{
    const rev = DB.sales.filter(s=>monthKey(s.date)===mk).reduce((s,x)=>s+Number(x.quantity)*Number(x.price),0);
    const stk = DB.purchases.filter(p=>monthKey(p.date)===mk).reduce((s,x)=>s+Number(x.quantity)*Number(x.unitCost),0);

      let ded=0; DB.absences.filter(a=>a.workerId===w.id && monthKey(a.date)===mk).forEach(a=>{
        const hpd=hoursPerDayForMonth(mk); const dr=w.monthlySalary/WORK_DAYS_PER_MONTH; const hr=dr/hpd;
        ded += a.type==='day'?dr:hr*Number(a.hours||0);
      });
      return s + (w.monthlySalary - adv - ded);
    },0);
    return {mk, rev, stk, lab, profit: rev-lab-stk};
  });

function countMonths(from,to){
  const a=new Date(from), b=new Date(to);
  return Math.max(1,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())+1);
}

/* ================= EVENTS ================= */
function bindEvents(){
  // WORKERS
  const addWorkerForm=document.getElementById('addWorkerForm');
  if(addWorkerForm) addWorkerForm.onsubmit=e=>{
    e.preventDefault(); const f=new FormData(e.target);
    DB.workers.push({id:uid(), name:f.get('name').trim(), role:f.get('role').trim(), monthlySalary:Number(f.get('salary'))});
    saveDB(); render();
  };
  const monthPicker=document.getElementById('monthPicker');
  if(monthPicker) monthPicker.onchange=e=>{ workersMonth=e.target.value; render(); };
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick=()=>{ const id=Number(el.dataset.open); openWorkerId = openWorkerId===id?null:id; render(); };
  });
  document.querySelectorAll('[data-advance-form]').forEach(f=>{
    f.onsubmit=e=>{ e.preventDefault(); const wid=Number(f.dataset.advanceForm); const fd=new FormData(f);
      DB.advances.push({id:uid(), workerId:wid, amount:Number(fd.get('amount')), date:fd.get('date')});
      saveDB(); render(); };
  });
  document.querySelectorAll('[data-absence-form]').forEach(f=>{
    f.onsubmit=e=>{ e.preventDefault(); const wid=Number(f.dataset.absenceForm); const fd=new FormData(f);
      DB.absences.push({id:uid(), workerId:wid, type:fd.get('type'), hours:Number(fd.get('hours')||0), date:fd.get('date')});
      saveDB(); render(); };
  });
  document.querySelectorAll('[data-del-advance]').forEach(el=>el.onclick=()=>{ DB.advances=DB.advances.filter(a=>a.id!==Number(el.dataset.delAdvance)); saveDB(); render(); });
  document.querySelectorAll('[data-del-absence]').forEach(el=>el.onclick=()=>{ DB.absences=DB.absences.filter(a=>a.id!==Number(el.dataset.delAbsence)); saveDB(); render(); });
  document.querySelectorAll('[data-edit-worker]').forEach(el=>el.onclick=async ()=>{
    if(!await askPin('Code to edit worker','0000')) return;
    const w=DB.workers.find(x=>x.id===Number(el.dataset.editWorker));
    const name=prompt('Name', w.name); if(name===null) return;
    const role=prompt('Role', w.role); if(role===null) return;
    const salary=prompt('Monthly salary', w.monthlySalary); if(salary===null) return;
    w.name=name.trim(); w.role=role.trim(); w.monthlySalary=Number(salary);
    saveDB(); render();
  });
  document.querySelectorAll('[data-del-worker]').forEach(el=>el.onclick=async ()=>{
    if(!await askPin('Code to delete worker','0000')) return;
    const id=Number(el.dataset.delWorker);
    DB.workers=DB.workers.filter(w=>w.id!==id);
    DB.advances=DB.advances.filter(a=>a.workerId!==id);
    DB.absences=DB.absences.filter(a=>a.workerId!==id);
    DB.withdrawals=DB.withdrawals.filter(a=>a.workerId!==id);
    saveDB(); render();
  });
  const btnPayrollPdf=document.getElementById('btnPayrollPdf');
  if(btnPayrollPdf) btnPayrollPdf.onclick=()=>generatePayrollPdf();

  // STOCK
  const addItemForm=document.getElementById('addItemForm');
  if(addItemForm) addItemForm.onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target);
    DB.items.push({id:uid(), name:f.get('name').trim(), unit:f.get('unit').trim()}); saveDB(); render(); };
  document.querySelectorAll('[data-edit-item]').forEach(el=>el.onclick=async ()=>{
    if(!await askPin('Code to edit item','0000')) return;
    const it=DB.items.find(x=>x.id===Number(el.dataset.editItem));
    const name=prompt('Name', it.name); if(name===null) return;
    const unit=prompt('Unit', it.unit); if(unit===null) return;
    it.name=name.trim(); it.unit=unit.trim(); saveDB(); render();
  });
  document.querySelectorAll('[data-del-item]').forEach(el=>el.onclick=async ()=>{
    if(!await askPin('Code to delete item','0000')) return;
    const id=Number(el.dataset.delItem);
    DB.items=DB.items.filter(x=>x.id!==id);
    DB.purchases=DB.purchases.filter(x=>x.itemId!==id);
    DB.withdrawals=DB.withdrawals.filter(x=>x.itemId!==id);
    saveDB(); render();
  });
  const addPurchaseForm=document.getElementById('addPurchaseForm');
  if(addPurchaseForm) addPurchaseForm.onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target);
    DB.purchases.push({id:uid(), itemId:Number(f.get('itemId')), quantity:Number(f.get('quantity')), unitCost:Number(f.get('unitCost')),
      supplier:f.get('supplier').trim(), matricule:f.get('matricule').trim(), date:f.get('date')});
    saveDB(); render(); };
  const btnItemSpendPdf=document.getElementById('btnItemSpendPdf');
  if(btnItemSpendPdf) btnItemSpendPdf.onclick=()=>generateItemSpendPdf();
  const addWithdrawalForm=document.getElementById('addWithdrawalForm');
  if(addWithdrawalForm) addWithdrawalForm.onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target);
    const itemId=Number(f.get('itemId')); const qty=Number(f.get('quantity'));
    const avail=itemStock(itemId);
    if(qty>avail){ alert('Not enough stock. Available: '+avail); return; }
    DB.withdrawals.push({id:uid(), workerId:Number(f.get('workerId')), itemId, quantity:qty, date:f.get('date')});
    saveDB(); render(); };
  const btnWorkerItemCostPdf=document.getElementById('btnWorkerItemCostPdf');
  if(btnWorkerItemCostPdf) btnWorkerItemCostPdf.onclick=()=>generateWorkerItemCostPdf();

  // SALES
  const addSaleItemForm=document.getElementById('addSaleItemForm');
  if(addSaleItemForm) addSaleItemForm.onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target);
    DB.saleItems.push({id:uid(), name:f.get('name').trim(), price:Number(f.get('price'))}); saveDB(); render(); };
  document.querySelectorAll('[data-edit-saleitem]').forEach(el=>el.onclick=async ()=>{
    if(!await askPin('Code to edit item','0000')) return;
    const si=DB.saleItems.find(x=>x.id===Number(el.dataset.editSaleitem));
    const name=prompt('Name', si.name); if(name===null) return;
    const price=prompt('Price', si.price); if(price===null) return;
    si.name=name.trim(); si.price=Number(price); saveDB(); render();
  });
  document.querySelectorAll('[data-del-saleitem]').forEach(el=>el.onclick=async ()=>{
    if(!await askPin('Code to delete item','0000')) return;
    const id=Number(el.dataset.delSaleitem);
    DB.saleItems=DB.saleItems.filter(x=>x.id!==id);
    DB.sales=DB.sales.filter(x=>x.saleItemId!==id);
    saveDB(); render();
  });
  const saleItemSelect=document.getElementById('saleItemSelect');
  if(saleItemSelect) saleItemSelect.onchange=()=>{
    const opt=saleItemSelect.selectedOptions[0];
    document.getElementById('salePriceInput').value = opt?.dataset.price || '';
  };
  const addSaleForm=document.getElementById('addSaleForm');
  if(addSaleForm) addSaleForm.onsubmit=e=>{ e.preventDefault(); const f=new FormData(e.target);
    DB.sales.push({id:uid(), saleItemId:Number(f.get('saleItemId')), quantity:Number(f.get('quantity')), price:Number(f.get('price')), date:f.get('date')});
    saveDB(); render(); };
  const btnSalesPdf=document.getElementById('btnSalesPdf');
  if(btnSalesPdf) btnSalesPdf.onclick=()=>generateSalesPdf();
  const btnResetSales=document.getElementById('btnResetSales');
  if(btnResetSales) btnResetSales.onclick=async ()=>{
    if(!await askPin('Code to reset sales history','0000')) return;
    if(!confirm('Delete all sales history?')) return;
    DB.sales=[];
    saveDB();
    render();
  };

  const fItemSelect=document.getElementById('fItemSelect');
  if(fItemSelect) fItemSelect.onchange=()=>{
    const opt=fItemSelect.selectedOptions[0];
    document.getElementById('fPrice').value = opt?.dataset.price || '';
  };
  const fClientName=document.getElementById('fClientName');
  if(fClientName) fClientName.oninput=()=>{ fState.clientName=fClientName.value; };
  const fClientAddress=document.getElementById('fClientAddress');
  if(fClientAddress) fClientAddress.oninput=()=>{ fState.clientAddress=fClientAddress.value; };
  const fClientMF=document.getElementById('fClientMF');
  if(fClientMF) fClientMF.oninput=()=>{ fState.clientMF=fClientMF.value; };
  const fDate=document.getElementById('fDate');
  if(fDate) fDate.oninput=()=>{ fState.date=fDate.value; };
  const fRemise=document.getElementById('fRemise');
  if(fRemise) fRemise.oninput=()=>{ fState.remise=Number(fRemise.value)||0; };
  const btnAddFactureLine=document.getElementById('btnAddFactureLine');
  if(btnAddFactureLine) btnAddFactureLine.onclick=()=>{
    const sel=document.getElementById('fItemSelect');
    const opt=sel.selectedOptions[0]; if(!opt) return;
    const qty=Number(document.getElementById('fQty').value)||0;
    const price=Number(document.getElementById('fPrice').value)||0;
    if(qty<=0) return;
    factureLines.push({saleItemId:Number(opt.value), name:opt.textContent, qty, price});
    render();
  };
  document.querySelectorAll('[data-del-fline]').forEach(el=>el.onclick=()=>{
    factureLines.splice(Number(el.dataset.delFline),1); render();
  });
  const btnGenerateFacture=document.getElementById('btnGenerateFacture');
  if(btnGenerateFacture) btnGenerateFacture.onclick=()=>{
    if(factureLines.length===0){ alert('Add at least one line first.'); return; }
    const client = {
      name: fState.clientName.trim() || '—',
      address: fState.clientAddress.trim() || '—',
      mf: fState.clientMF.trim() || '—'
    };
    const date = fState.date || todayStr();
    const remise = Number(fState.remise)||0;
    const logSales = document.getElementById('fLogSales').checked;
    generateSaleFacturePdf(client, date, remise, factureLines);
    if(logSales){
      factureLines.forEach(l=>{
        DB.sales.push({id:uid(), saleItemId:l.saleItemId, quantity:l.qty, price:l.price, date});
      });
      saveDB();
    }
    factureLines = [];
    fState = { clientName:'', clientAddress:'', clientMF:'', date:todayStr(), remise:0 };
    render();
  };

  // COMMANDES
  const addCommandeForm=document.getElementById('addCommandeForm');
  if(addCommandeForm) addCommandeForm.onsubmit=e=>{
    e.preventDefault();
    const f=new FormData(e.target);
    const name=(f.get('name')||'').toString().trim();
    const price=Number(f.get('price'))||0;
    const client=(f.get('client')||'').toString().trim();
    const comment=(f.get('comment')||'').toString().trim();
    const date=f.get('date')||todayStr();
    // Auto-create matching sellable item
    const saleItem={id:uid(), name:client? `${name} (${client})` : name, price};
    DB.saleItems.push(saleItem);
    DB.commandes.push({id:uid(), saleItemId:saleItem.id, name, price, client, comment, date, status:'waiting'});
    saveDB(); render();
  };
  document.querySelectorAll('[data-cmd-status]').forEach(sel=>sel.onchange=()=>{
    const id=Number(sel.dataset.cmdStatus);
    const c=DB.commandes.find(x=>x.id===id); if(!c) return;
    const prev=c.status;
    c.status=sel.value;
    // When newly marked sold, log a sale (once)
    if(c.status==='sold' && prev!=='sold' && !c.saleLoggedId){
      const saleId=uid();
      DB.sales.push({id:saleId, saleItemId:c.saleItemId, quantity:1, price:Number(c.price)||0, date:todayStr()});
      c.saleLoggedId=saleId;
    }
    // If moved away from sold, remove the auto-logged sale
    if(prev==='sold' && c.status!=='sold' && c.saleLoggedId){
      DB.sales=DB.sales.filter(s=>s.id!==c.saleLoggedId);
      delete c.saleLoggedId;
    }
    saveDB(); render();
  });

    if(c && c.saleLoggedId) DB.sales=DB.sales.filter(s=>s.id!==c.saleLoggedId);
    DB.commandes=DB.commandes.filter(x=>x.id!==id);

    render();
  };
  const btnFullReportPdf=document.getElementById('btnFullReportPdf');
  if(btnFullReportPdf) btnFullReportPdf.onclick=()=>generateFullReportPdf();
}

/* ================= PDF GENERATORS ================= */
function newDoc(){ const {jsPDF}=window.jspdf; return new jsPDF(); }
function pdfHeader(doc, title, subtitle){
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(title, 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(100);
  doc.text(subtitle, 14, 25);
  doc.setTextColor(0);
}

function generatePayrollPdf(){
  const doc=newDoc();
  pdfHeader(doc, 'Payroll Report', `${monthLabel(workersMonth)} — generated ${todayStr()}`);
  const rows = DB.workers.map(w=>workerPayForMonth(w.id, workersMonth)).sort((a,b)=>b.performance-a.performance);
  doc.autoTable({
    startY: 32,
    head:[['#','Worker','Salary','Advances','Deductions','Net Pay','Performance']],
    body: rows.map((r,i)=>[i+1, r.worker.name, money(r.worker.monthlySalary), money(r.advTotal), money(r.deduction), money(r.net), r.performance.toFixed(1)+'%']),
    styles:{fontSize:9}, headStyles:{fillColor:[201,162,75]}
  });
  const total = rows.reduce((s,r)=>s+r.net,0);
  const y = doc.lastAutoTable.finalY + 10;
  doc.setFont('helvetica','bold'); doc.text(`Total payroll: ${money(total)}`, 14, y);
  if(rows.length) doc.text(`Best performer: ${rows[0].worker.name} (${rows[0].performance.toFixed(1)}%)`, 14, y+8);
  doc.save(`payroll-${workersMonth}.pdf`);
}

function generateSaleFacturePdf(client, date, remise, lines){
  const doc=newDoc();
  const invoiceNo = 'F' + Date.now().toString().slice(-8);

  // company header
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text(COMPANY.name, 14, 18);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(COMPANY.activity, 14, 24);
  doc.text(`MF: ${COMPANY.mf}`, 14, 29);
  doc.text(`RC: ${COMPANY.rc}`, 14, 34);
  doc.text(`GSM: ${COMPANY.gsm}`, 14, 39);

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('FACTURE', 196, 18, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text(`N°: ${invoiceNo}`, 196, 25, {align:'right'});
  doc.text(`Date: ${date}`, 196, 30, {align:'right'});

  doc.setDrawColor(200); doc.line(14, 44, 196, 44);

  // client block
  doc.setFont('helvetica','bold'); doc.text('Client', 14, 52);
  doc.setFont('helvetica','normal');
  doc.text(`Nom: ${client.name}`, 14, 58);
  doc.text(`Adresse: ${client.address}`, 14, 63);
  doc.text(`Matricule fiscal: ${client.mf}`, 14, 68);

  const ht = lines.reduce((s,l)=>s+l.qty*l.price,0);
  doc.autoTable({
    startY: 76,
    head:[['Désignation','Quantité','Prix unitaire','Total HT']],
    body: lines.map(l=>[l.name, l.qty, money(l.price), money(l.qty*l.price)]),
    styles:{fontSize:10}, headStyles:{fillColor:[201,162,75]}
  });

  const netHT = Math.max(0, ht - remise);
  const fodec = netHT*0.01;
  const baseTva = netHT+fodec;
  const tva = baseTva*0.19;
  const timbre = 1;
  const ttc = baseTva+tva+timbre;

  let y = doc.lastAutoTable.finalY + 8;
  const line=(label,val,bold=false)=>{
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.text(label, 140, y); doc.text(val, 190, y, {align:'right'}); y+=6;
  };
  line('Total HT:', money(ht));
  if(remise>0) line('Remise:', '-'+money(remise));
  line('FODEC (1%):', money(fodec));
  line('TVA (19%):', money(tva));
  line('Timbre fiscal:', money(timbre));
  doc.setDrawColor(180); doc.line(140, y-2, 190, y-2);
  line('Total TTC:', money(ttc), true);

  // cachet et signature
  y += 20;
  if(y>260){ doc.addPage(); y=40; }
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Cachet et signature', 150, y);
  doc.rect(140, y+4, 50, 28);

  doc.save(`facture-${invoiceNo}.pdf`);
}

function generateItemSpendPdf(){
  const doc=newDoc();
  pdfHeader(doc, 'Stock Spend by Item', `generated ${todayStr()}`);
  const rows = DB.items.map(it=>{
    const p = DB.purchases.filter(x=>x.itemId===it.id);
    const qty = p.reduce((s,x)=>s+Number(x.quantity),0);
    const cost = p.reduce((s,x)=>s+Number(x.quantity)*Number(x.unitCost),0);
    return [it.name, it.unit||'-', qty, money(cost)];
  });
  doc.autoTable({ startY:32, head:[['Item','Unit','Qty purchased','Total spent']], body:rows, styles:{fontSize:9}, headStyles:{fillColor:[201,162,75]} });
  const total = DB.purchases.reduce((s,p)=>s+Number(p.quantity)*Number(p.unitCost),0);
  doc.setFont('helvetica','bold');
  doc.text(`Total spent on stock: ${money(total)}`, 14, doc.lastAutoTable.finalY+10);
  doc.save('item-spend.pdf');
}

function generateWorkerItemCostPdf(){
  const doc=newDoc();
  pdfHeader(doc, 'Worker Item Cost Report', `generated ${todayStr()}`);
  const rows = DB.workers.map(w=>{
    const wd = DB.withdrawals.filter(x=>x.workerId===w.id);
    const cost = wd.reduce((s,x)=>s+Number(x.quantity)*itemAvgCost(x.itemId),0);
    return [w.name, wd.length, money(cost)];
  });
  doc.autoTable({ startY:32, head:[['Worker','Withdrawals','Total item cost']], body:rows, styles:{fontSize:9}, headStyles:{fillColor:[201,162,75]} });
  doc.save('worker-item-cost.pdf');
}

function generateSalesPdf(){
  const doc=newDoc();
  pdfHeader(doc, 'Sales Report', `generated ${todayStr()}`);
  const rows = [...DB.sales].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{
    const si=DB.saleItems.find(x=>x.id===s.saleItemId);
    return [s.date, si?si.name:'—', s.quantity, money(s.price), money(Number(s.quantity)*Number(s.price))];
  });
  doc.autoTable({ startY:32, head:[['Date','Item','Qty','Price','Revenue']], body:rows, styles:{fontSize:9}, headStyles:{fillColor:[201,162,75]} });
  const totalQty = DB.sales.reduce((s,x)=>s+Number(x.quantity),0);
  const totalRev = DB.sales.reduce((s,x)=>s+Number(x.quantity)*Number(x.price),0);
  const y=doc.lastAutoTable.finalY+10;
  doc.setFont('helvetica','bold');
  doc.text(`Total sold: ${totalQty}`, 14, y);
  doc.text(`Total revenue: ${money(totalRev)}`, 14, y+8);
  doc.save('sales-report.pdf');
}

function generateFullReportPdf(){
  const doc=newDoc();
  pdfHeader(doc, 'Full Business Report', `${adminFrom} to ${adminTo}`);
  const monthsInRange = countMonths(adminFrom, adminTo);

  let y=32;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Labor', 14, y); y+=4;
  const workerRows = DB.workers.map(w=>{
    const adv = DB.advances.filter(a=>a.workerId===w.id && a.date>=adminFrom && a.date<=adminTo).reduce((s,a)=>s+Number(a.amount),0);
    let ded=0;
    DB.absences.filter(a=>a.workerId===w.id && a.date>=adminFrom && a.date<=adminTo).forEach(a=>{
      const mk=monthKey(a.date), hpd=hoursPerDayForMonth(mk);
      const dailyRate=w.monthlySalary/WORK_DAYS_PER_MONTH, hourlyRate=dailyRate/hpd;
      ded += a.type==='day'?dailyRate:hourlyRate*Number(a.hours||0);
    });
    const net=(w.monthlySalary*monthsInRange)-adv-ded;
    return [w.name, money(w.monthlySalary*monthsInRange), money(adv), money(ded), money(net)];
  });
  doc.autoTable({ startY:y, head:[['Worker','Base pay','Advances','Deductions','Net']], body:workerRows, styles:{fontSize:8}, headStyles:{fillColor:[201,162,75]} });
  y = doc.lastAutoTable.finalY+10;
  const laborCost = workerRows.reduce((s,r,i)=>{
    const w=DB.workers[i];
    const adv = DB.advances.filter(a=>a.workerId===w.id && a.date>=adminFrom && a.date<=adminTo).reduce((s2,a)=>s2+Number(a.amount),0);
    let ded=0;
    DB.absences.filter(a=>a.workerId===w.id && a.date>=adminFrom && a.date<=adminTo).forEach(a=>{
      const mk=monthKey(a.date), hpd=hoursPerDayForMonth(mk);
      const dailyRate=w.monthlySalary/WORK_DAYS_PER_MONTH, hourlyRate=dailyRate/hpd;
      ded += a.type==='day'?dailyRate:hourlyRate*Number(a.hours||0);
    });
    return s + (w.monthlySalary*monthsInRange)-adv-ded;
  },0);

  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Stock purchases', 14, y); y+=4;
  const purchasesInRange = DB.purchases.filter(p=>p.date>=adminFrom && p.date<=adminTo);
  doc.autoTable({ startY:y, head:[['Date','Item','Supplier','Total']],
    body:purchasesInRange.map(p=>{ const it=DB.items.find(x=>x.id===p.itemId); return [p.date, it?it.name:'—', p.supplier, money(Number(p.quantity)*Number(p.unitCost))]; }),
    styles:{fontSize:8}, headStyles:{fillColor:[201,162,75]} });
  y = doc.lastAutoTable.finalY+10;
  const stockCost = purchasesInRange.reduce((s,p)=>s+Number(p.quantity)*Number(p.unitCost),0);

  if(y>250){ doc.addPage(); y=20; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Sales', 14, y); y+=4;
  const salesInRange = DB.sales.filter(s=>s.date>=adminFrom && s.date<=adminTo);
  doc.autoTable({ startY:y, head:[['Date','Item','Qty','Revenue']],
    body:salesInRange.map(s=>{ const si=DB.saleItems.find(x=>x.id===s.saleItemId); return [s.date, si?si.name:'—', s.quantity, money(Number(s.quantity)*Number(s.price))]; }),
    styles:{fontSize:8}, headStyles:{fillColor:[201,162,75]} });
  y = doc.lastAutoTable.finalY+12;
  const revenue = salesInRange.reduce((s,x)=>s+Number(x.quantity)*Number(x.price),0);
  const profit = revenue-laborCost-stockCost;

  if(y>250){ doc.addPage(); y=20; }
  doc.setFontSize(12);
  doc.text(`Total labor cost: ${money(laborCost)}`, 14, y);
  doc.text(`Total stock purchases: ${money(stockCost)}`, 14, y+8);
  doc.text(`Total sales revenue: ${money(revenue)}`, 14, y+16);
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.setTextColor(profit<0?200:0, profit<0?0:120, 0);
  doc.text(`NET PROFIT: ${money(profit)}`, 14, y+28);
  doc.save(`full-report-${adminFrom}-to-${adminTo}.pdf`);
}
